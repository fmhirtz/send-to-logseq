<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rounded sunny background -->
  <rect width="128" height="128" rx="28" fill="#ffd166"/>

  <!-- Motion trail behind the flying page -->
  <g stroke="#ef476f" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="14" y1="56" x2="38" y2="56"/>
    <line x1="20" y1="74" x2="42" y2="74" opacity="0.7"/>
    <line x1="14" y1="92" x2="34" y2="92" opacity="0.45"/>
  </g>

  <!-- A page in flight, tilted forward, containing a Logseq-style outliner -->
  <g transform="rotate(10 84 64)">
    <rect x="50" y="26" width="60" height="76" rx="9"
          fill="#fffbf0" stroke="#1d3557" stroke-width="5"/>

    <!-- Three bullet-and-line rows, like Logseq's outliner blocks -->
    <circle cx="64" cy="48" r="4.5" fill="#06d6a0"/>
    <line   x1="73" y1="48" x2="100" y2="48"
            stroke="#1d3557" stroke-width="5" stroke-linecap="round"/>

    <circle cx="64" cy="66" r="4.5" fill="#06d6a0"/>
    <line   x1="73" y1="66" x2="96"  y2="66"
            stroke="#1d3557" stroke-width="5" stroke-linecap="round"/>

    <circle cx="64" cy="84" r="4.5" fill="#06d6a0"/>
    <line   x1="73" y1="84" x2="100" y2="84"
            stroke="#1d3557" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
