<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Send to Logseq — Options</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --border: #e5e5e5;
      --accent: #2c3e50;
      --accent-fg: #ffffff;
      --ok: #1e8449;
      --err: #b03a2e;
      --field-bg: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1f1f;
        --fg: #ececec;
        --muted: #9a9a9a;
        --border: #3a3a3a;
        --accent: #5dade2;
        --accent-fg: #0b1a26;
        --ok: #58d68d;
        --err: #ec7063;
        --field-bg: #262626;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 24px;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin: 0 0 18px;
    }
    legend { padding: 0 6px; font-weight: 600; font-size: 13px; }
    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }
    label:first-of-type { margin-top: 0; }
    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 7px 9px;
      margin-top: 4px;
      font: inherit;
      color: var(--fg);
      background: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    input:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      align-items: center;
    }
    button {
      font: inherit;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
    }
    button:hover { background: var(--field-bg); }
    button.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
      font-weight: 500;
    }
    button.primary:hover { filter: brightness(1.1); background: var(--accent); }
    .status { font-size: 13px; }
    .status.ok  { color: var(--ok); }
    .status.err { color: var(--err); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--field-bg);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Send to Logseq</h1>
    <p class="sub">Configure how the extension talks to your local Logseq.</p>

    <fieldset>
      <legend>Logseq HTTP API</legend>

      <label>
        Host
        <input type="text" id="host" placeholder="http://127.0.0.1:12315">
        <div class="hint">The default is <code>http://127.0.0.1:12315</code>. Only change this if you've reconfigured Logseq's HTTP server.</div>
      </label>

      <label>
        Token
        <input type="password" id="token" placeholder="Paste the token from Logseq">
        <div class="hint">
          In Logseq desktop: enable <em>HTTP APIs server</em> under Settings → Features, open the <code>&lt;/&gt;</code> panel in the title bar, start the server, and authorize a new token.
        </div>
      </label>
    </fieldset>

    <fieldset>
      <legend>Journal date format</legend>
      <label>
        Override (optional)
        <input type="text" id="dateFormatOverride" placeholder="leave blank to read from Logseq">
        <div class="hint">
          By default the extension reads <code>preferredDateFormat</code> from Logseq on each use.
          Set this only if you want to force a specific format like <code>yyyy-MM-dd</code> or <code>MMM do, yyyy</code>.
          Supported tokens: <code>yyyy yy MMMM MMM MM M do dd d EEEE EEE</code>.
        </div>
      </label>
    </fieldset>

    <div class="row">
      <button id="save" class="primary">Save</button>
      <button id="test">Test connection</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
